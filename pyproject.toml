[project]
name = "telaah"
version = "0.1.0"
description = "Research partner untuk skripsi/tesis/disertasi: kumpulkan artikel, index ke vector DB, tanya dan putuskan berdasarkan bukti."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmad" }]
keywords = ["research", "thesis", "rag", "literature-review"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "chromadb",
    "pypdf",
    "prompt_toolkit",
    "rich",
]

[project.urls]
Repository = "https://github.com/hiiamanop/skripsi-ai"

[project.scripts]
telaah = "telaah.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest"]
